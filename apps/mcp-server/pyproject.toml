[project]
name = "mcp-server"
version = "0.1.0"
description = "Minimal MCP Server for Self-Host Serv Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.14.1",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
